name: Production readiness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Test server
        run: npm test -- --run
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Smoke test production server
        shell: bash
        run: |
          set -euo pipefail

          PORT=3011 npm start --prefix server > /tmp/webtools-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3011/api/health > /dev/null; then
              break
            fi

            if [[ "$attempt" == "20" ]]; then
              cat /tmp/webtools-server.log
              exit 1
            fi

            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3011/ > /dev/null
          curl --fail --silent http://127.0.0.1:3011/tools/url-status-checker > /dev/null
          curl --fail --silent \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"html":"<a href=\"/old\">Old</a>","attribute":"href"}' \
            http://127.0.0.1:3011/api/tools/html-refactor/extract \
            | grep --fixed-strings '"/old"' > /dev/null
